<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrustBuild Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --navy:#06264b;
  --blue:#0869da;
  --bg:#f4f7fb;
  --line:#dce4ee;
  --ink:#10233a;
  --muted:#66788b;
  --green:#16834b;
  --red:#b42318;
  --orange:#c76b00;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  background:var(--bg);
  color:var(--ink);
}

button,input,select,textarea{font:inherit}

button{cursor:pointer}

.hidden{display:none!important}

.wrap{
  max-width:1250px;
  margin:auto;
  padding:24px;
}

.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}

.box{
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:0 12px 35px #06264b12;
  padding:30px;
  width:min(440px,100%);
}

.logo{
  width:150px;
  display:block;
  margin:0 auto 20px;
}

.h{
  text-align:center;
  color:var(--navy);
}

.muted{color:var(--muted)}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
  margin:14px 0;
}

.field input,
.field select,
.field textarea,
.toolbar input,
.toolbar select{
  border:1px solid #cbd7e4;
  border-radius:11px;
  padding:12px;
  background:#fff;
}

.field textarea{
  min-height:110px;
  resize:vertical;
}

.btn{
  border:0;
  border-radius:11px;
  padding:12px 16px;
  font-weight:800;
}

.primary{
  background:var(--blue);
  color:#fff;
  width:100%;
}

.top{
  background:var(--navy);
  color:#fff;
}

.topin{
  max-width:1250px;
  margin:auto;
  padding:16px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:900;
  font-size:20px;
}

.brand img{
  width:48px;
  height:48px;
  object-fit:contain;
  background:#fff;
  border-radius:9px;
}

.logout{
  background:#fff;
  color:var(--navy);
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin:24px 0;
}

.stat{
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  padding:18px;
}

.stat b{
  font-size:30px;
  display:block;
  color:var(--navy);
  margin-top:4px;
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.search{
  flex:1 1 280px;
}

.toolbar input,
.toolbar select{
  min-height:44px;
}

.notice{
  padding:12px;
  border-radius:12px;
  background:#eef7ff;
  border-left:4px solid var(--blue);
  margin:14px 0;
}

.error{
  color:var(--red);
  background:#fff1f1;
  border-left-color:var(--red);
}

.tablewrap{
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  overflow:auto;
}

.table{
  width:100%;
  border-collapse:collapse;
  min-width:1050px;
}

.table th,
.table td{
  padding:14px;
  border-bottom:1px solid #edf1f5;
  text-align:left;
  vertical-align:top;
}

.table th{
  font-size:12px;
  text-transform:uppercase;
  color:var(--muted);
}

.table tr:hover td{
  background:#f8fbff;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.actions button,
.actions select{
  border:1px solid var(--line);
  border-radius:8px;
  padding:7px 9px;
  background:#fff;
}

.actions .view{
  background:var(--blue);
  color:#fff;
  border-color:var(--blue);
}

.status{
  padding:7px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  background:#edf2f7;
}

.badge.priority{
  background:#fff0df;
  color:var(--orange);
}

.badge.emergency{
  background:#ffe7e7;
  color:var(--red);
}

.modal{
  position:fixed;
  inset:0;
  background:#061a2dcc;
  display:grid;
  place-items:center;
  padding:18px;
  z-index:1000;
}

.modalbox{
  width:min(720px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:20px;
  box-shadow:0 20px 60px #0005;
}

.modalhead{
  position:sticky;
  top:0;
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  z-index:2;
}

.modalbody{
  padding:20px;
}

.close{
  border:0;
  background:#eef2f6;
  border-radius:10px;
  width:40px;
  height:40px;
  font-size:20px;
}

.detailgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.detail{
  background:#f7f9fc;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
}

.detail.full{
  grid-column:1/-1;
}

.detail label{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  margin-bottom:5px;
}

.modal-actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:18px;
}

.modal-actions button,
.modal-actions a{
  text-decoration:none;
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-weight:800;
}

.call{background:#e9f7ef;color:var(--green)}
.text{background:#eaf4ff;color:var(--blue)}
.map{background:#f0f2f5;color:var(--ink)}

.save{
  background:var(--blue);
  color:#fff;
}

.csv{
  background:#fff;
  border:1px solid var(--line);
}

@media(max-width:800px){
  .grid{
    grid-template-columns:1fr 1fr;
  }

  .wrap{
    padding:16px;
  }

  .topin{
    padding:12px 16px;
  }

  .brand span{
    font-size:17px;
  }
}

@media(max-width:480px){
  .grid{
    grid-template-columns:1fr 1fr;
  }

  .detailgrid{
    grid-template-columns:1fr;
  }

  .detail.full{
    grid-column:auto;
  }

  .logout{
    padding:10px 12px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="login" class="login">

  <div class="box">

    <img
      class="logo"
      src="https://raw.githubusercontent.com/r4fd9smmnr-cpu/trustbuild-v1/main/trustbuild-logo.png"
      alt="TrustBuild"
    >

    <h1 class="h">TrustBuild Admin</h1>

    <p class="muted" style="text-align:center">
      Private dashboard
    </p>

    <form id="loginForm">

      <div class="field">

        <label>Email</label>

        <input
          id="email"
          type="email"
          value="trustbuildhandyman@outlook.com"
          required
        >

      </div>

      <button class="btn primary" type="submit">
        SEND LOGIN LINK
      </button>

    </form>

    <div id="loginMsg" class="notice hidden"></div>

  </div>

</div>


<!-- APP -->

<div id="app" class="hidden">

<header class="top">

  <div class="topin">

    <div class="brand">

      <img
        src="https://raw.githubusercontent.com/r4fd9smmnr-cpu/trustbuild-v1/main/trustbuild-logo.png"
        alt=""
      >

      <span>TrustBuild Admin</span>

    </div>

    <button id="logout" class="btn logout">
      Log out
    </button>

  </div>

</header>


<main class="wrap">

  <h1>Dashboard</h1>

  <p class="muted">
    Manage service requests, estimates and scheduled jobs.
  </p>


  <!-- STATS -->

  <div class="grid">

    <div class="stat">
      <span class="muted">Total</span>
      <b id="total">0</b>
    </div>

    <div class="stat">
      <span class="muted">New</span>
      <b id="new">0</b>
    </div>

    <div class="stat">
      <span class="muted">Bookings</span>
      <b id="bookings">0</b>
    </div>

    <div class="stat">
      <span class="muted">Quotes</span>
      <b id="quotes">0</b>
    </div>

  </div>


  <!-- TOOLBAR -->

  <div class="toolbar">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="Search customer, phone, service or Job #"
    >

    <select id="filter">

      <option value="all">All statuses</option>
      <option value="new">New</option>
      <option value="reviewing">Reviewing</option>
      <option value="estimated">Estimated</option>
      <option value="scheduled">Scheduled</option>
      <option value="in_progress">In progress</option>
      <option value="completed">Completed</option>
      <option value="paid">Paid</option>
      <option value="cancelled">Cancelled</option>

    </select>

    <select id="typeFilter">

      <option value="all">All types</option>
      <option value="booking">Bookings</option>
      <option value="quote">Quotes</option>

    </select>

    <button id="refresh" class="btn csv">
      ↻ Refresh
    </button>

    <button id="export" class="btn csv">
      ↓ Export CSV
    </button>

  </div>


  <div id="error" class="notice error hidden"></div>


  <!-- TABLE -->

  <div class="tablewrap">

    <table class="table">

      <thead>

        <tr>

          <th>Job</th>
          <th>Type</th>
          <th>Customer</th>
          <th>Service</th>
          <th>Date</th>
          <th>Status</th>
          <th>Actions</th>

        </tr>

      </thead>

      <tbody id="rows"></tbody>

    </table>

  </div>

</main>

</div>


<!-- DETAIL MODAL -->

<div id="modal" class="modal hidden">

  <div class="modalbox">

    <div class="modalhead">

      <div>
        <strong id="modalTitle">Request</strong>
        <div id="modalSubtitle" class="muted"></div>
      </div>

      <button id="closeModal" class="close">
        ×
      </button>

    </div>


    <div class="modalbody">

      <div id="details" class="detailgrid"></div>


      <div class="field">

        <label>Status</label>

        <select id="modalStatus">

          <option value="new">New</option>
          <option value="reviewing">Reviewing</option>
          <option value="estimated">Estimated</option>
          <option value="scheduled">Scheduled</option>
          <option value="in_progress">In progress</option>
          <option value="completed">Completed</option>
          <option value="paid">Paid</option>
          <option value="cancelled">Cancelled</option>

        </select>

      </div>


      <div class="field">

        <label>Estimate Amount ($)</label>

        <input
          id="estimate"
          type="number"
          min="0"
          step="0.01"
          placeholder="0.00"
        >

      </div>


      <div class="field">

        <label>Scheduled Date & Time</label>

        <input
          id="scheduled"
          type="datetime-local"
        >

      </div>


      <div class="field">

        <label>Internal Notes</label>

        <textarea
          id="notes"
          placeholder="Private notes for TrustBuild..."
        ></textarea>

      </div>


      <div class="modal-actions">

        <a id="callBtn" class="call">
          📞 Call
        </a>

        <a id="textBtn" class="text">
          💬 Text
        </a>

        <a id="mapBtn" class="map" target="_blank">
          📍 Maps
        </a>

        <button id="copyBtn" class="map">
          📋 Copy Info
        </button>

        <button id="saveBtn" class="save">
          💾 Save Changes
        </button>

      </div>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://vxhdjunxoerbkdnklkew.supabase.co";

const SUPABASE_KEY =
"sb_publishable_K4Vewrs_-H21Xoeycn0jvg_ACr-YwL3";

const sb =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const ADMIN_EMAIL =
"trustbuildhandyman@outlook.com";

let all = [];
let selected = null;


const $ =
id => document.getElementById(id);


/* LOGIN MESSAGE */

function msg(text){

  $("loginMsg").textContent = text;

  $("loginMsg")
    .classList
    .remove("hidden");

}


/* LOGIN */

$("loginForm").addEventListener(
"submit",
async e => {

  e.preventDefault();

  const email =
    $("email")
      .value
      .trim()
      .toLowerCase();

  if(email !== ADMIN_EMAIL){

    msg(
      "Use the TrustBuild admin email."
    );

    return;

  }


  const {error} =
    await sb.auth.signInWithOtp({

      email,

      options:{
        shouldCreateUser:true,

        emailRedirectTo:
        "https://trustbuild-handyman-v1.vercel.app/admin.html"
      }

    });


  if(error){

    msg(error.message);

  }else{

    msg(
      "Login link sent. Check your email, then open the link on this device."
    );

  }

});


/* LOGOUT */

$("logout").onclick =
async () => {

  await sb.auth.signOut();

  showLogin();

};


/* EVENTS */

$("refresh").onclick = load;

$("filter").onchange = render;

$("typeFilter").onchange = render;

$("search").oninput = render;

$("export").onclick = exportCSV;

$("closeModal").onclick = closeModal;

$("modal").addEventListener(
"click",
e => {

  if(e.target === $("modal"))
    closeModal();

});


/* LOGIN / APP */

function showLogin(){

  $("app")
    .classList
    .add("hidden");

  $("login")
    .classList
    .remove("hidden");

}


function showApp(){

  $("login")
    .classList
    .add("hidden");

  $("app")
    .classList
    .remove("hidden");

  load();

}


/* LOAD */

async function load(){

  const {data,error} =
    await sb
      .from("requests")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );


  if(error){

    $("error").textContent =
      error.message;

    $("error")
      .classList
      .remove("hidden");

    return;

  }


  $("error")
    .classList
    .add("hidden");


  all = data || [];


  updateStats();

  render();

}


/* STATS */

function updateStats(){

  $("total").textContent =
    all.length;

  $("new").textContent =
    all.filter(
      x => x.status === "new"
    ).length;

  $("bookings").textContent =
    all.filter(
      x => x.type === "booking"
    ).length;

  $("quotes").textContent =
    all.filter(
      x => x.type === "quote"
    ).length;

}


/* SEARCH + FILTER */

function render(){

  const status =
    $("filter").value;

  const type =
    $("typeFilter").value;

  const search =
    $("search")
      .value
      .trim()
      .toLowerCase();


  let data = all.filter(x => {

    const statusOK =
      status === "all" ||
      x.status === status;

    const typeOK =
      type === "all" ||
      x.type === type;

    const text = [

      x.job_number,
      x.customer_name,
      x.phone,
      x.email,
      x.service,
      x.address,
      x.description

    ]
    .join(" ")
    .toLowerCase();


    const searchOK =
      !search ||
      text.includes(search);


    return statusOK &&
           typeOK &&
           searchOK;

  });


  $("rows").innerHTML =
    data.map(rowHTML).join("")
    ||
    `
    <tr>
      <td colspan="7" class="muted">
        No requests found.
      </td>
    </tr>
    `;


  document
    .querySelectorAll("[data-view]")
    .forEach(btn => {

      btn.onclick = () =>
        openModal(btn.dataset.view);

    });


  document
    .querySelectorAll("[data-status]")
    .forEach(select => {

      select.onchange =
        updateStatus;

    });

}


/* TABLE ROW */

function rowHTML(x){

  const urgency =
    (x.urgency || "").toLowerCase();

  let urgencyBadge = "";

  if(
    urgency.includes("emergency")
  ){

    urgencyBadge =
      `<span class="badge emergency">
        Emergency
      </span>`;

  }else if(
    urgency.includes("priority") ||
    urgency.includes("urgent")
  ){

    urgencyBadge =
      `<span class="badge priority">
        Priority
      </span>`;

  }


  return `

  <tr>

    <td>

      <strong>
        ${esc(x.job_number || "")}
      </strong>

      <br>

      ${urgencyBadge}

    </td>


    <td>

      ${
        x.type === "booking"
          ? "Booking"
          : "Quote"
      }

    </td>


    <td>

      <strong>
        ${esc(x.customer_name)}
      </strong>

      <br>

      <a href="tel:${esc(x.phone)}">
        ${esc(x.phone)}
      </a>

      ${
        x.email
          ? `<br>${esc(x.email)}`
          : ""
      }

    </td>


    <td>

      ${esc(x.service)}

      <br>

      <span class="muted">

        ${esc(
          x.description || ""
        ).slice(0,90)}

      </span>

    </td>


    <td>

      ${
        x.preferred_date ||
        "—"
      }

      ${
        x.preferred_time
          ? `<br>${esc(x.preferred_time)}`
          : ""
      }

    </td>


    <td>

      <select
        class="status"
        data-status="${esc(x.id)}"
      >

        ${
          statuses()
          .map(s => `

            <option
              value="${s}"
              ${
                s === x.status
                  ? "selected"
                  : ""
              }
            >
              ${prettyStatus(s)}
            </option>

          `)
          .join("")
        }

      </select>

    </td>


    <td>

      <div class="actions">

        <button
          class="view"
          data-view="${esc(x.id)}"
        >
          View
        </button>

        <button
          onclick="quickCall('${escAttr(x.phone)}')"
        >
          📞
        </button>

        <button
          onclick="quickText('${escAttr(x.phone)}')"
        >
          💬
        </button>

        ${
          x.address
            ? `
              <button
                onclick="openMap('${escAttr(x.address)}')"
              >
                📍
              </button>
            `
            : ""
        }

      </div>

    </td>

  </tr>

  `;

}


/* STATUS */

function statuses(){

  return [

    "new",
    "reviewing",
    "estimated",
    "scheduled",
    "in_progress",
    "completed",
    "paid",
    "cancelled"

  ];

}


function prettyStatus(s){

  return s
    .replaceAll("_"," ")
    .replace(
      /\b\w/g,
      c => c.toUpperCase()
    );

}


/* UPDATE STATUS */

async function updateStatus(e){

  const id =
    e.target.dataset.status;

  const status =
    e.target.value;


  const {error} =
    await sb
      .from("requests")
      .update({status})
      .eq("id",id);


  if(error){

    alert(error.message);

    await load();

    return;

  }


  const x =
    all.find(
      r => r.id === id
    );


  if(x)
    x.status = status;


  updateStats();

}


/* OPEN MODAL */

function openModal(id){

  selected =
    all.find(
      x => x.id === id
    );


  if(!selected)
    return;


  $("modalTitle").textContent =
    selected.job_number || "Request";


  $("modalSubtitle").textContent =
    selected.customer_name || "";


  $("modalStatus").value =
    selected.status || "new";


  $("estimate").value =
    selected.estimate_amount ?? "";


  $("notes").value =
    selected.internal_notes || "";


  $("scheduled").value =
    toLocalDateTime(
      selected.scheduled_at
    );


  $("details").innerHTML = `

    <div class="detail">

      <label>Customer</label>

      ${esc(
        selected.customer_name
      )}

    </div>


    <div class="detail">

      <label>Phone</label>

      <a href="tel:${esc(selected.phone)}">
        ${esc(selected.phone)}
      </a>

    </div>


    <div class="detail">

      <label>Email</label>

      ${
        selected.email
          ? esc(selected.email)
          : "—"
      }

    </div>


    <div class="detail">

      <label>Type</label>

      ${
        selected.type === "booking"
          ? "Booking"
          : "Quote"
      }

    </div>


    <div class="detail">

      <label>Service</label>

      ${esc(selected.service)}

    </div>


    <div class="detail">

      <label>Preferred Date</label>

      ${
        selected.preferred_date ||
        "—"
      }

    </div>


    <div class="detail">

      <label>Preferred Time</label>

      ${
        esc(
          selected.preferred_time ||
          "—"
        )
      }

    </div>


    <div class="detail">

      <label>Urgency</label>

      ${
        esc(
          selected.urgency ||
          "Normal"
        )
      }

    </div>


    <div class="detail full">

      <label>Address</label>

      ${
        esc(
          selected.address ||
          "—"
        )
      }

    </div>


    <div class="detail full">

      <label>Customer Description</label>

      ${
        esc(
          selected.description ||
          "No description provided."
        )
      }

    </div>


    <div class="detail">

      <label>Photos</label>

      ${
        Number(
          selected.photo_count || 0
        )
      }

    </div>


    <div class="detail">

      <label>Created</label>

      ${
        selected.created_at
          ? new Date(
              selected.created_at
            ).toLocaleString()
          : "—"
      }

    </div>

  `;


  $("callBtn").href =
    "tel:" + selected.phone;


  $("textBtn").href =
    "sms:" + selected.phone;


  $("mapBtn").href =
    selected.address
      ? mapURL(selected.address)
      : "#";


  $("modal")
    .classList
    .remove("hidden");

}


/* CLOSE MODAL */

function closeModal(){

  selected = null;

  $("modal")
    .classList
    .add("hidden");

}


/* SAVE DETAILS */

$("saveBtn").onclick =
async () => {

  if(!selected)
    return;


  const status =
    $("modalStatus").value;

  const estimate =
    $("estimate").value;


  const scheduled =
    $("scheduled").value;


  const notes =
    $("notes").value;


  const payload = {

    status,

    estimate_amount:
      estimate === ""
        ? null
        : Number(estimate),

    scheduled_at:
      scheduled
        ? new Date(
            scheduled
          ).toISOString()
        : null,

    internal_notes:
      notes || null

  };


  const {error} =
    await sb
      .from("requests")
      .update(payload)
      .eq("id",selected.id);


  if(error){

    alert(
      "Could not save: " +
      error.message
    );

    return;

  }


  Object.assign(
    selected,
    payload
  );


  alert(
    "Request updated successfully."
  );


  closeModal();

  await load();

};

/* QUICK CALL */

function quickCall(phone){

  window.location.href =
    "tel:" + phone;

}


/* QUICK TEXT */

function quickText(phone){

  window.location.href =
    "sms:" + phone;

}


/* MAP */

function openMap(address){

  window.open(
    mapURL(address),
    "_blank"
  );

}


function mapURL(address){

  return (
    "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(address)
  );

}


/* LOCAL DATETIME */

function toLocalDateTime(value){

  if(!value)
    return "";

  const d =
    new Date(value);

  if(isNaN(d))
    return "";

  const pad =
    n => String(n).padStart(2,"0");


  return (
    d.getFullYear() +
    "-" +
    pad(d.getMonth()+1) +
    "-" +
    pad(d.getDate()) +
    "T" +
    pad(d.getHours()) +
    ":" +
    pad(d.getMinutes())
  );

}


/* CSV EXPORT */

function exportCSV(){

  const headers = [

    "Job Number",
    "Type",
    "Customer",
    "Phone",
    "Email",
    "Address",
    "Service",
    "Description",
    "Preferred Date",
    "Preferred Time",
    "Urgency",
    "Status",
    "Estimate",
    "Scheduled",
    "Photo Count",
    "Created"

  ];


  const rows =
    all.map(x => [

      x.job_number,
      x.type,
      x.customer_name,
      x.phone,
      x.email,
      x.address,
      x.service,
      x.description,
      x.preferred_date,
      x.preferred_time,
      x.urgency,
      x.status,
      x.estimate_amount,
      x.scheduled_at,
      x.photo_count,
      x.created_at

    ]);


  const csv =
    [headers,...rows]
      .map(row =>
        row
          .map(csvCell)
          .join(",")
      )
      .join("\n");


  const blob =
    new Blob(
      [csv],
      {type:"text/csv;charset=utf-8"}
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href = url;

  a.download =
    "trustbuild-requests-" +
    new Date()
      .toISOString()
      .slice(0,10) +
    ".csv";


  a.click();


  URL.revokeObjectURL(url);

}


function csvCell(value){

  return `"${String(
    value ?? ""
  ).replaceAll('"','""')}"`;

}


/* SECURITY: HTML ESCAPE */

function esc(v){

  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escAttr(v){

  return String(v ?? "")
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'")
    .replaceAll('"','&quot;');

}

      }

    }
  );

</script>
